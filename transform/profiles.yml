# Credentials come from environment variables (see .env.example). Never commit real ones.
saas_metrics:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'metrics') }}"
      password: "{{ env_var('PGPASSWORD', 'metrics') }}"
      dbname: "{{ env_var('PGDATABASE', 'metrics') }}"
      schema: analytics
      threads: 4
